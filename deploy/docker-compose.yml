# HomeTV: app + Tailscale sidecar sharing one network namespace. No ports are published on the
# host or LAN; the app listens on 127.0.0.1:8000 and `tailscale serve` exposes it over HTTPS at
# https://hometv.<tailnet>.ts.net. Setup: see README.md (cp .env.example .env first).
services:
  tailscale:
    image: tailscale/tailscale:v1.76.6          # pin a tested tag
    hostname: hometv
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_HOSTNAME: hometv
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "false"
      TS_EXTRA_ARGS: --advertise-tags=tag:media-server
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    devices: ["/dev/net/tun:/dev/net/tun"]
    cap_add: [net_admin, sys_module]
    restart: unless-stopped
  app:
    build: { context: .., dockerfile: deploy/Dockerfile }
    network_mode: service:tailscale              # no ports published on host/LAN
    depends_on: [tailscale]
    environment:
      HOMETV_HOST: 127.0.0.1
      # The film and TV folders are chosen inside /media in Administración → Bibliotecas.
      HOMETV_TMDB_API_KEY: ${TMDB_API_KEY}
      HOMETV_TMDB_LANGUAGE: es-ES
    volumes:
      - ${MEDIA_DIR}:/media:ro                   # one broad parent; more disks: /srv/disk2:/media/disk2:ro
      - hometv-data:/data
    restart: unless-stopped
volumes: { tailscale-state: {}, hometv-data: {} }
