# Alembic CLI config (run from server/: `uv run alembic upgrade head`).
# The app runs migrations programmatically at startup (hometv.db.engine.run_migrations).
# sqlalchemy.url is left unset: env.py falls back to the HomeTV settings ({data_dir}/hometv.db).

[alembic]
script_location = %(here)s/hometv/db/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
