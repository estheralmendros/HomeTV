[project]
name = "hometv"
version = "0.1.0"
description = "HomeTV server: self-hosted media catalog and playback"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2",
    "alembic",
    "guessit",
    "babelfish",
    "httpx",
    "itsdangerous",
    "pydantic>=2",
    "pydantic-settings",
    "pyyaml",
]

[project.scripts]
hometv = "hometv.main:run"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hometv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: requires real ffmpeg/ffprobe binaries (skipped when missing)",
    "perf: performance benchmarks (excluded from the default run)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"hometv/db/migrations/versions/*.py" = ["E501"]
